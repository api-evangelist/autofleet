    kind: api-client
    audience: first-party-internal
    note: >-
      "HTTP client for the Autofleet API, intended for use primarily from cloud
      functions." Wraps @autofleet/rapido-http-client and handles authentication
      transparently — the refresh token is read from Google Secret Manager and
      exchanged for an access token. This is the only public evidence of the
