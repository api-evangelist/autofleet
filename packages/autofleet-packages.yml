description: >-
  First-party packages published by Autofleet to public registries. IMPORTANT
  CAVEAT: Autofleet publishes an @autofleet npm scope, but these are the
  company's INTERNAL microservice and mobile-app infrastructure libraries
  (logging, metrics, Kafka, Sequelize helpers, geo tooling, identity
  middleware), not client SDKs for the public Autofleet Platform API. The one
  package that does wrap the Autofleet API — @autofleet/api-http-client — is
  described by its own README as intended for Autofleet's own cloud functions
  and reads its refresh token from Google Secret Manager. No customer-facing,
  documented SDK for the Autofleet Platform API was found on npm, PyPI, Maven
  Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io. For that reason
  this repo deliberately does NOT wire a `type: SDKs` pointer in apis.yml — the
  packages exist, a published client SDK does not.
