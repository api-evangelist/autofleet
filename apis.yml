aid: autofleet
name: Autofleet
description: 'Autofleet is a fleet and mobility optimization platform founded in 2018
  in Tel Aviv by Kobi Eisenberg and Dor Shay, and since 2024 an independently operated,
  wholly owned subsidiary of Element Fleet Management Corp. (TSX: EFN). Its AI-driven
  software plans, dispatches, routes and simulates vehicle-based operations across
  postal and parcel delivery, last-mile logistics, rental and car sharing, corporate
  motor pools, microtransit, NEMT and school transport, taxi and rideshare, field
  service, and autonomous mobility, in more than 20 countries. The platform is sold
  as an integration hub — Autofleet markets a public API and webhooks for connecting
  telematics, GPS, keyless access, maintenance, booking, dispatch, CRM and ERP systems
  — and adds Nova, a fleet-specific generative AI layer for natural-language operational
  questions. The API gateway is live at api.autofleet.io, but the developer reference
  at docs.autofleet.io is a password-protected ReadMe hub, so no machine-readable
  contract is publicly retrievable.'
